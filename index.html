<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limelight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Ubuntu Mono", monospace;
        }
        body {
            background-color: black;
        }
        div {
            gap: 0;
            color: white;
        }
    </style>
</head>
<body onload="getBrainrot()">
    <div id="flexbox">
    <div>licensed under gpl 3</div>
    <div>font: ubuntu mono</div>
    <div>theme: bash console</div>
    <div>made in one hour</div>
    <hr>
    <div>freakybob@limelight:~$ limelight</div>
    <div>> limelight: your brainrot word of the day</div>
    <div id="brainrot"></div>
    </div>
    <script>
                function getBrainrot() {
   
    var brainrot = new Array();
    brainrot[0] = "skibidi";
    brainrot[1] = "rizz";
    brainrot[2] = "greg";
    brainrot[3] = "freakybob";

var number = Math.floor(Math.random()*brainrot.length); 
 
 return document.getElementById('brainrot').innerHTML = '> your word is ' + brainrot[number]
} 
</script>
</body>
</html>
